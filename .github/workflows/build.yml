name: build

on:
  push:
    branches: [main, 'port/**', 'support/**', 'feat/**', 'fix/**', 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  wrapper-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v6

  loader-builds:
    strategy:
      fail-fast: false
      matrix:
        loader: [fabric, forge, neoforge]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :${{ matrix.loader }}:check :${{ matrix.loader }}:build

  verification:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew clean check build

  fabric-client-gametest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - run: xvfb-run -a ./gradlew :fabric:runClientGameTest
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabric-client-gametest-screenshots
          path: fabric/build/run/clientGameTest/screenshots
