name: Bug report
description: Report a reproducible animation or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options: [Fabric, Forge, NeoForge]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Minecraft, mod, and loader versions
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Graphics backend
      options: [OpenGL, Vulkan, Unknown]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: packs
    attributes:
      label: Resource packs and other mods
  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      render: shell
