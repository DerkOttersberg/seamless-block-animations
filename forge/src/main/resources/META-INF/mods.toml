modLoader="javafml"
loaderVersion="${loader_version_range}"
license="CC0-1.0"
issueTrackerURL="https://github.com/DerkOttersberg/Seamless-block-animations/issues"
clientSideOnly=true

[[mods]]
modId="seamless_block_animations"
version="${mod_version}"
displayName="Seamless Block Animations"
displayURL="https://github.com/DerkOttersberg/Seamless-block-animations"
logoFile="assets/seamless_block_animations/icon.png"
authors="Derk Ottersberg"
displayTest="IGNORE_ALL_VERSION"
description='''Smooth client-side door, trapdoor, and fence-gate animations using resource-pack models.'''

[[mixins]]
config="seamless_block_animations.mixins.json"

[[dependencies.seamless_block_animations]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.seamless_block_animations]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
